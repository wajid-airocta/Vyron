plugins { id 'com.android.application' }

def localReleaseStore = System.getenv('VYRON_RELEASE_STORE_FILE')

android {
    namespace 'com.airocta.vyron'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.airocta.vyron'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        localRelease {
            if (localReleaseStore) {
                storeFile file(localReleaseStore)
                storePassword System.getenv('VYRON_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('VYRON_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('VYRON_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'STARTER_GEMINI_API_KEY',
                    groovy.json.JsonOutput.toJson(System.getenv('VYRON_STARTER_KEY') ?: '')
        }
        release {
            buildConfigField 'String', 'STARTER_GEMINI_API_KEY',
                    groovy.json.JsonOutput.toJson(System.getenv('VYRON_STARTER_KEY') ?: '')
            if (localReleaseStore) signingConfig signingConfigs.localRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
