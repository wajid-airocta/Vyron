plugins { id 'com.android.application' }

android {
    namespace 'com.airocta.vyron'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.airocta.vyron'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            buildConfigField 'String', 'STARTER_GEMINI_API_KEY',
                    groovy.json.JsonOutput.toJson(System.getenv('VYRON_STARTER_KEY') ?: '')
        }
        release {
            buildConfigField 'String', 'STARTER_GEMINI_API_KEY', '""'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
}
